# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: saraberg123
# "service" is the name of this project. This will also be added to your AWS resource names.
service: calendar-events-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions:
  getEvents:
    handler: functions/events/getEvents/index.handler
    events:
      - httpApi:
          path: /events
          method: get

  getEventById:
    handler: functions/events/getEventById/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: get

  createEvent:
    handler: functions/events/createEvent/index.handler
    events:
      - httpApi:
          path: /events
          method: post

  updateEvent:
    handler: functions/events/updateEvent/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: patch

  deleteEvent:
    handler: functions/events/deleteEvent/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: delete
