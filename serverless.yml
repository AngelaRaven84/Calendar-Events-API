org: saraberg123

service: calendar-events-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Calendar-db

        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Calendar-users

functions:
  createUser:
    handler: functions/users/createUser/index.handler
    events:
      - httpApi:
          path: /users
          method: post

  getUserById:
    handler: functions/users/getUserById/index.handler
    events:
      - httpApi:
          path: /users/{userId}
          method: get

  getEvents:
    handler: functions/events/getEvents/index.handler
    events:
      - httpApi:
          path: /users/{userId}/events
          method: get

  getEventById:
    handler: functions/events/getEventById/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: get

  createEvent:
    handler: functions/events/createEvent/index.handler
    events:
      - httpApi:
          path: /users/{userId}/events
          method: post

  updateEvent:
    handler: functions/events/updateEvent/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: patch

  deleteEvent:
    handler: functions/events/deleteEvent/index.handler
    events:
      - httpApi:
          path: /events/{id}
          method: delete
